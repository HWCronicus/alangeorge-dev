app = "alangeorge-dev"
primary_region = "iad"   # pick the region closest to most of your visitors

[build]
  dockerfile = "dockerfile"   # your file is lowercase; Fly's builder is Linux, so be explicit

[http_service]
  internal_port = 8282
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[services]]
  protocol = "tcp"
  internal_port = 42069
  auto_stop_machines = "off"
  min_machines_running = 1

  [[services.ports]]
    port = 22

  [services.concurrency]
    type = "connections"
    hard_limit = 50
    soft_limit = 40

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"