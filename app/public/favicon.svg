<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient x1="00%" y1="0%" x2="50%" y2="100%" id="nnneon-grad">
            <stop stop-color="hsl(37, 91%, 80%)" stop-opacity="1" offset="0%"></stop>
            <stop stop-color="hsl(30, 100%, 50%)" stop-opacity="1" offset="100%"></stop>
        </linearGradient>
        <filter id="neon-glow">
            <feGaussianBlur stdDeviation="4" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <text x="100" y="180" font-family="Arial Black, sans-serif" font-size="230" font-weight="bold"
        fill="#1e1e1e" text-anchor="middle">A</text>

    <text x="100" y="180" font-family="Arial Black, sans-serif" font-size="230" font-weight="bold"
        fill="none" stroke="url(#nnneon-grad)" stroke-width="6" text-anchor="middle"
        filter="url(#neon-glow)">A</text>
</svg>